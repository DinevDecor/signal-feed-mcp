name: publish
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.2.0 (must equal the package version)"
        required: true
permissions:
  contents: read
env:
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the package version
        run: |
          v=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "$TAG"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the MCPB bundle
        run: npx -y @anthropic-ai/mcpb pack . "signal-feed-mcp-${TAG#v}.mcpb"
      - name: GitHub release with the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" signal-feed-mcp-*.mcpb --target "$GITHUB_SHA" --generate-notes --title "$TAG"

  pypi:
    # PyPI trusted publishing (no token). Needs the pending publisher on PyPI: project signal-feed-mcp,
    # owner DinevDecor, repository signal-feed-mcp, workflow publish.yml, environment pypi.
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    # Official MCP Registry (registry.modelcontextprotocol.io). GitHub OIDC login gives the io.github.DinevDecor/*
    # namespace. The registry checks that the PyPI package exists and that its README carries the mcp-name line.
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4
      - name: server.json versions must match the tag
        run: |
          test "$(jq -r .version server.json)" = "${TAG#v}"
          test "$(jq -r '.packages[0].version' server.json)" = "${TAG#v}"
      - name: Wait for the version on PyPI
        run: |
          for i in $(seq 1 30); do
            curl -fsS "https://pypi.org/pypi/signal-feed-mcp/${TAG#v}/json" >/dev/null && exit 0
            sleep 10
          done
          exit 1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fLsS -o "$archive" "$base_url/$archive"
          curl -fLsS -o "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
